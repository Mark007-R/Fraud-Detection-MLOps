stages:
  load_fdb:
    cmd: .venv\Scripts\python.exe src/load_fdb.py
    deps:
      - src/load_fdb.py
    params:
      - fdb
    outs:
      - data/raw/sparkov.csv

  combine:
    cmd: .venv\Scripts\python.exe src/combine_datasets.py
    deps:
      - src/combine_datasets.py
      - data/raw/paysim.csv
      - data/raw/sparkov.csv
    params:
      - combine
    outs:
      - data/processed/combined_transactions.csv

  preprocess:
    cmd: .venv\Scripts\python.exe src/preprocess.py
    deps:
      - src/preprocess.py
      - data/processed/combined_transactions.csv
    params:
      - preprocess
    outs:
      - data/processed/features.csv

  train:
    cmd: .venv\Scripts\python.exe src/train.py
    deps:
      - src/train.py
      - data/processed/features.csv
    params:
      - train
      - data
    outs:
      - models/fraud_model.pkl
      - data/processed/X_test.csv
      - data/processed/y_test.csv

  evaluate:
    cmd: .venv\Scripts\python.exe src/evaluate.py
    deps:
      - src/evaluate.py
      - models/fraud_model.pkl
      - data/processed/features.csv
      - data/processed/X_test.csv
      - data/processed/y_test.csv
    params:
      - evaluate
      - data
    metrics:
      - metrics/scores.json:
          cache: false
    plots:
      - reports/confusion_matrix.svg
      - reports/roc_curve.svg

  benchmark_fdb:
    cmd: .venv\Scripts\python.exe -m src.benchmark_fdb
    deps:
      - src/benchmark_fdb.py
      - models/fraud_model.pkl
    params:
      - fdb
      - benchmark
    metrics:
      - metrics/fdb_benchmark.json:
          cache: false
